<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-label="Jagyeong Gu - Radar-centric perception for autonomous driving">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2432"/>
      <stop offset="55%" stop-color="#243447"/>
      <stop offset="100%" stop-color="#2E4560"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5FD3A6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5FD3A6" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="card"><rect width="820" height="200" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="820" height="200" fill="url(#bg)"/>

    <g transform="translate(672 100)" fill="none" stroke="#5FD3A6" stroke-opacity="0.22" stroke-width="1.5">
      <circle r="42"/><circle r="74"/><circle r="106"/><circle r="138"/>
    </g>
    <g transform="translate(672 100)">
      <path d="M0 0 L138 -52 A148 148 0 0 1 138 52 Z" fill="url(#sweep)" opacity="0.5"/>
      <circle r="4" fill="#5FD3A6"/>
      <circle cx="96" cy="-34" r="3.5" fill="#7FE3BC"/>
      <circle cx="120" cy="26" r="3" fill="#7FE3BC" opacity="0.8"/>
      <circle cx="58" cy="52" r="2.5" fill="#7FE3BC" opacity="0.65"/>
    </g>

    <rect x="48" y="58" width="3" height="84" rx="1.5" fill="#5FD3A6"/>

    <text x="70" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#F2F5F8" letter-spacing="0.5">Jagyeong Gu</text>
    <text x="70" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#5FD3A6" letter-spacing="0.3">Radar-centric perception for autonomous driving</text>
    <text x="70" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#93A4B8" letter-spacing="0.2">AVLab &#183; Intelligent Robotics Engineering &#183; Chungbuk National University</text>
  </g>
