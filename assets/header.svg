<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-label="Jagyeong Gu - Multi-modal sensor fusion and edge deployment for autonomous driving">
  <defs>
    <clipPath id="card"><rect width="820" height="200" rx="16"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151C28"/><stop offset="100%" stop-color="#1E2B3D"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="820" height="200" fill="url(#base)"/>
    <g filter="url(#blur)">
      <ellipse cx="120" cy="40" rx="170" ry="110" fill="#5FD3A6" fill-opacity="0.55"/>
      <ellipse cx="470" cy="210" rx="220" ry="120" fill="#3A6EA5" fill-opacity="0.55"/>
      <ellipse cx="760" cy="30" rx="180" ry="120" fill="#7A5C9E" fill-opacity="0.55"/>
      <ellipse cx="680" cy="190" rx="150" ry="90" fill="#2FA88A" fill-opacity="0.35"/>
    </g>
    <rect x="40" y="32" width="740" height="142" rx="18" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="58" y="32.5" width="704" height="1" fill="url(#edge)"/>
    <text x="76" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#F4F7FA" letter-spacing="0.5">Jagyeong Gu</text>
    <text x="76" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#8FE8C6" letter-spacing="0.3">Multi-modal sensor fusion &amp; edge deployment for autonomous driving</text>
    <text x="76" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#B7C3D2" letter-spacing="0.2">BS-MS student &#183; AVLab &#183; Dept. of Intelligent Systems and Robotics &#183; Chungbuk National University</text>
    <text x="76" y="153" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9FB0C3" letter-spacing="0.3">wkrud4431@chungbuk.ac.kr</text>
